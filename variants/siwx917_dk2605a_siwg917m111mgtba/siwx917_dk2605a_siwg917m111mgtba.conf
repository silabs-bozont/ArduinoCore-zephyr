CONFIG_MAIN_STACK_SIZE=16000
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_LLEXT_HEAP_SIZE=64
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1

CONFIG_I2C=y
CONFIG_SPI=y

# Stack sizes
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4_AUTO=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_POSIX_API=y

# Wi-Fi
CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y

CONFIG_WIFI_SILABS_SIWX91X=y
CONFIG_WIFI_SILABS_SIWX91X_NET_STACK_NATIVE=y

# TLS
CONFIG_MBEDTLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_CURRENT_THREAD_USE_TLS=n

# Other
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y

CONFIG_NET_SOCKETS=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y

# DNS
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

CONFIG_ARDUINO_API_SERIAL_BUFFER_SIZE=512
